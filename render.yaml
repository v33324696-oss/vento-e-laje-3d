services:
  - type: web
    name: vento-e-laje-3d
    runtime: node
    plan: free
    region: ohio
    buildCommand: "cd game-source && npm ci --include=dev --no-audit --no-fund && npm run build"
    startCommand: "cd game-source && npm start"
    healthCheckPath: /healthz
    autoDeployTrigger: commit
